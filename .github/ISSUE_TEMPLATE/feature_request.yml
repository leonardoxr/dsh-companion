name: Feature request
description: Propose a focused improvement to the companion API
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What client or user need is not currently met?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the endpoint, field, documentation, or behavior you would add.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain any workarounds or other designs you considered.
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and security impact
      description: Note required Harness services, newly exposed metadata, or client migration concerns.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: The proposal keeps the API read-only.
          required: true
        - label: I searched existing issues for similar requests.
          required: true
